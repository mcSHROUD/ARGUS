cameras:
  - id: cam1
    device: /dev/video0
    width: 1920
    height: 1080
    fps: 60
    roi: [700, 0, 600, 700]   # x, y, w, h — зона инспекции барабана
  - id: cam2
    device: /dev/video1
    width: 1920
    height: 1080
    fps: 60
    roi: [700, 0, 600, 700]

motion:
  history: 500
  var_threshold: 16
  drum_stop_threshold: 0.004   # frame-diff в ROI: <= = барабан стоит (стакан ещё может крутиться)
  drum_move_threshold: 0.019   # frame-diff в ROI: >= = барабан крутится
  stop_window_ms: 50           # мс "тишины" после пика вращения

burst:
  frames: 5              # кадров за одну паузу
  max_duration_ms: 800   # максимальная длительность burst
  min_sharpness: 30.0    # минимальная резкость (Laplacian variance) для включения в burst

sync:
  window_ms: 300         # окно матчинга событий двух камер

detector:
  model_path: models/patchcore.ckpt
  backbone: wide_resnet50_2
  threshold: 0.5         # перезаписывается при calibrate
  image_size: [256, 256]

storage:
  db_path: /data/argus.db
  images_dir: /data
  save_worst_only: true  # сохранять только кадр с максимальным score на камеру

ui:
  host: 0.0.0.0          # внутри контейнера слушаем все интерфейсы
  port: 8000             # на хосте публикуется только на 127.0.0.1 (см. docker-compose.yml)

logging:
  level: INFO
