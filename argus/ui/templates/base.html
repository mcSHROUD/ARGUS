<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{% block title %}ARGUS{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; max-width: 1200px; margin: 2rem auto; padding: 0 1rem; color: #222; }
        h1 { border-bottom: 2px solid #eee; padding-bottom: .5rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #eee; }
        tr:hover { background: #f8f8f8; }
        .defect { color: #c00; font-weight: bold; }
        .good { color: #0a0; }
        .filter { margin: 1rem 0; }
        .filter a { margin-right: 1rem; text-decoration: none; padding: .25rem .5rem; border-radius: 4px; }
        .filter a.active { background: #222; color: #fff; }
        img { max-width: 100%; border: 1px solid #ddd; }
        .row { display: flex; gap: 1rem; }
        .col { flex: 1; }
        button { padding: .5rem 1rem; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px; }
        button:hover { background: #f0f0f0; }
    </style>
</head>
<body>
    <h1>ARGUS — review</h1>
    {% block content %}{% endblock %}
</body>
</html>
